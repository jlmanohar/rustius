[package]
name = "rustius-rdp-worker"
version = "0.1.0"
edition = "2021"

[workspace]

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
smallvec = "1"
ironrdp-input = "0.7"

# IronRDP in an isolated workspace with no russh conflicts
ironrdp = { version = "0.17", default-features = false, features = ["core", "pdu", "session", "graphics", "input", "connector"] }
ironrdp-blocking = "0.10"
ironrdp-async = "0.10"
sspi = { version = "0.21", features = ["network_client"] }
picky-krb = "=0.12.4"
tokio-rustls = "0.26"
x509-cert = { version = "0.2", default-features = false, features = ["std"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-no-provider"] }
