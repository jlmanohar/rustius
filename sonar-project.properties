# SonarCloud configuration for Rustius
sonar.organization=jlmanohar
sonar.projectKey=jlmanohar_rustius
sonar.projectName=rustius

# Source directories to analyze (frontend + backend crates + worker)
sonar.sources=src,src-tauri/src,crates,workers/rustius-rdp-worker/src

# Exclude compiled targets, generated schemas, assets, and dependencies
sonar.exclusions=\
  **/node_modules/**,\
  **/target/**,\
  **/.svelte-kit/**,\
  **/build/**,\
  **/dist/**,\
  **/*.lock,\
  **/src-tauri/gen/**,\
  **/src-tauri/icons/**,\
  static/**

# Test and coverage exclusions (in Rust, unit tests live inline in source files via #[cfg(test)])
sonar.coverage.exclusions=**/*test*.rs,**/*tests*/**

# Encoding
sonar.sourceEncoding=UTF-8
