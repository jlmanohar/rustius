[package]
name = "ironrdp-graphics"
version = "0.9.0"
readme = "README.md"
description = "Patched RDP image processing primitives with resilient SRL progressive decoder"
edition = "2021"
license = "MIT OR Apache-2.0"

[lib]
doctest = false

[dependencies]
bit_field = "0.10"
bitflags = "2.11"
bitvec = "1.0"
ironrdp-core = { git = "https://github.com/Devolutions/IronRDP" }
ironrdp-pdu = { git = "https://github.com/Devolutions/IronRDP", features = ["std"] }
byteorder = "1.5"
num-derive = "0.4"
num-traits = "0.2"
yuv = { version = "0.8", features = ["rdp"] }
wide = "0.7"

[dev-dependencies]
bmp = "0.5"
bytemuck = "1.24"
expect-test = "1"
