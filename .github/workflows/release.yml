name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      draft:
        description: 'Create as a draft release'
        required: false
        type: boolean
        default: false

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest]
        # Linux and macOS builds temporarily disabled:
        # platform: [windows-latest, macos-latest, ubuntu-22.04]

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: swatinem/rust-cache@v2

      - name: Install Linux dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            xdg-utils

      - name: Install frontend dependencies
        run: npm ci

      - name: Compute Tag & Release Info
        id: vars
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
            SAFE_REF=$(echo "${{ github.ref_name }}" | sed 's/[^a-zA-Z0-9._-]/-/g')
            TAG="v${VERSION}-${SAFE_REF}.${SHORT_SHA}"
            echo "tag=${TAG}" >> $GITHUB_OUTPUT
            echo "release_name=Rustius ${TAG}" >> $GITHUB_OUTPUT
            echo "prerelease=true" >> $GITHUB_OUTPUT
            echo "draft=${{ github.event.inputs.draft }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
            echo "release_name=Rustius ${{ github.ref_name }}" >> $GITHUB_OUTPUT
            echo "prerelease=false" >> $GITHUB_OUTPUT
            echo "draft=false" >> $GITHUB_OUTPUT
          fi

      - name: Build Tauri app & create GitHub Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ steps.vars.outputs.tag }}
          releaseName: ${{ steps.vars.outputs.release_name }}
          releaseBody: |
            ## ${{ steps.vars.outputs.release_name }}

            See the release assets below to download the installer:
            - **Windows**: `.msi` / `.exe` (NSIS) / `.zip` (Portable)
            <!-- - **macOS**: `.dmg` / `.app` -->
            <!-- - **Linux**: `.deb` / `.AppImage` -->
          releaseDraft: ${{ steps.vars.outputs.draft == 'true' }}
          prerelease: ${{ steps.vars.outputs.prerelease == 'true' }}

      - name: Package & Upload Windows Portable Zip
        if: matrix.platform == 'windows-latest'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PORTABLE_DIR="rustius-portable"
          rm -rf "$PORTABLE_DIR"
          mkdir -p "$PORTABLE_DIR/resources/binaries/freerdp"

          # Copy standalone binary
          if [ -f "target/release/rustius.exe" ]; then
            cp "target/release/rustius.exe" "$PORTABLE_DIR/"
          elif [ -f "src-tauri/target/release/rustius.exe" ]; then
            cp "src-tauri/target/release/rustius.exe" "$PORTABLE_DIR/"
          fi

          # Include FreeRDP binary for hardware accelerated RDP support
          cp "resources/binaries/freerdp/wfreerdp.exe" "$PORTABLE_DIR/resources/binaries/freerdp/"

          # Marker file to activate portable data directory (isolated to ./data/)
          touch "$PORTABLE_DIR/.portable"

          VERSION=$(node -p "require('./package.json').version")
          ZIP_NAME="rustius_${VERSION}_x64-portable.zip"
          7z a "$ZIP_NAME" "./$PORTABLE_DIR/*"

          gh release upload "${{ steps.vars.outputs.tag }}" "$ZIP_NAME" --clobber

