[package]
name = "rustius-rdp"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "RDP client implementation for Rustius"

[dependencies]
rustius-core = { path = "../rustius-core" }
tokio.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
serde.workspace = true
serde_json.workspace = true
base64.workspace = true
sha2.workspace = true
parking_lot = "0.12"

ironrdp = { git = "https://github.com/Devolutions/IronRDP", features = ["input", "client", "rustls", "graphics", "core"] }
ironrdp-client = { git = "https://github.com/Devolutions/IronRDP", default-features = false, features = ["rustls", "clipboard"] }
ironrdp-cliprdr = { git = "https://github.com/Devolutions/IronRDP" }
ironrdp-cliprdr-native = { git = "https://github.com/Devolutions/IronRDP" }
ironrdp-pdu = { git = "https://github.com/Devolutions/IronRDP" }
ironrdp-tls = { git = "https://github.com/Devolutions/IronRDP" }
ironrdp-dvc = { git = "https://github.com/Devolutions/IronRDP" }
ironrdp-egfx = { git = "https://github.com/Devolutions/IronRDP", features = ["openh264", "openh264-bundled"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Threading",
    "Win32_System_DataExchange",
    "Win32_UI_Shell",
    "Win32_System_Memory",
] }
