<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" type="image/svg+xml" href="%sveltekit.assets%/rustius_icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Rustius</title>
    <!-- Bundled Local Typography (100% Offline / Zero External Requests) -->
    <link rel="stylesheet" href="%sveltekit.assets%/fonts/fonts.css" />
    %sveltekit.head%
    <style>
      html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        width: 100%;
        background-color: #000000;
        color: #ededed;
        font-family: 'Geist', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        overflow: hidden;
        user-select: none;
      }
      .terminal-shell, .terminal-shell * {
        user-select: text !important;
      }
    </style>
  </head>
  <body data-sveltekit-preload-data="hover">
    <script>
      // Disable default browser context menu globally for native desktop app feel
      window.addEventListener('contextmenu', (e) => e.preventDefault());
    </script>
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
