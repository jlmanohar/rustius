[workspace]
members = [
    "src-tauri",
    "crates/rustius-core",
    "crates/rustius-ssh",
    "crates/rustius-rdp",
    "crates/rustius-terminal",
]
resolver = "2"

[workspace.package]
version = "0.1.1"
edition = "2021"
authors = ["jlmanohar"]
license = "MIT"

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# Error handling
anyhow = "1"
thiserror = "2"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# SSH
russh = { version = "0.63", default-features = false, features = ["ring", "flate2", "rsa"] }
russh-sftp = "3.0"

# Terminal
portable-pty = "0.9"

# UUID for connection IDs
uuid = { version = "1", features = ["v4", "v5", "serde"] }

# Date/time
chrono = { version = "0.4", features = ["serde"] }

# Tauri
tauri = { version = "2", features = [] }
tauri-build = { version = "2", features = [] }
tauri-plugin-opener = "2"
base64 = "0.22"

# Security & Keyring
keyring = { version = "3", features = ["windows-native", "apple-native", "sync-secret-service"] }
aes = "0.8"
aes-gcm = "0.10"
argon2 = "0.5"
rand = "0.8"
cbc = "0.1"
cfb-mode = "0.8"
md-5 = "0.10"
sha1 = "0.10"
hmac = "0.12"
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }

# XML Parsing
quick-xml = "0.37"

# ==============================================================================
# Build Profiles
# ==============================================================================

# Dev profile: optimized for lightning-fast compilation and iteration cycles
[profile.dev]
opt-level = 0            # No optimizations on workspace crates for instant compile
debug = 1                # Line tables only (slashes MSVC link time and PDB size)
incremental = true       # Incremental compilation caching
codegen-units = 256      # Maximum parallelism across all available CPU threads

# Optimize external dependencies (crypto, ssh, tokio) even in dev mode so
# cryptographic handshakes and SSH connections run at full speed without
# slowing down recompilation of local workspace crates.
[profile.dev.package."*"]
opt-level = 1

# Release profile: maximum performance and minimal binary footprint
[profile.release]
opt-level = 3            # Aggressive speed optimizations, inlining & loop vectorization
lto = "thin"             # High-performance ThinLTO with multi-threaded codegen
codegen-units = 16       # 16 parallel LLVM code generation units (utilizes multi-core CPUs)
panic = "abort"          # Remove unwinding tables for smaller binary and faster execution
strip = true             # Strip all debug symbols for a clean portable single executable
overflow-checks = true   # Ensure integer overflow safety in production
